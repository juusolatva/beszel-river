# Keeps the SHA-pinned actions in .github/workflows/ current. npm dependencies are updated by hand
# (exact versions, see AGENTS.md); Docker base image digests are pinned and updated here too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives a compromised or broken release a week to be noticed before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
