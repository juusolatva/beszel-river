# Keeps the SHA-pinned actions in .github/workflows/ current. npm dependencies are updated by hand
# (exact versions, see AGENTS.md). The Docker base image and the images CI runs (deploy/test/compose.ci.yml)
# are pinned by digest and updated here too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives a compromised or broken release a week to be noticed before it is proposed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # The base image's Node line is the production runtime: a new major is a deliberate change made with
    # .nvmrc, engines, the CI matrix and the docs (AGENTS.md). Without this, a major update would also
    # replace the patch updates for the current line.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # node's tag names its Alpine release (-alpine3.24) and the final stage's alpine base must match it
      # (deploy/Dockerfile), so a new Alpine release is a deliberate change to both, not an update.
      - dependency-name: alpine
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Patch and digest updates of both images in one pull request.
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy/test
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
