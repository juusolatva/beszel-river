name: CI

on:
  push:
    branches: [main]
    # Release tags: the publish job builds and pushes the image for them.
    tags: ["v*"]
  pull_request:
  # A manual run on main rebuilds and publishes edge (for example after changing the publish job).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24.22.1: production pin in .nvmrc and minimum in package.json "engines". 24: latest LTS patch.
        # 26: the current release line, the next production version.
        node: ["24.22.1", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame and new-code detection
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # The publish job builds the image from the npm registry in Docker, without this cache.
          cache: npm # zizmor: ignore[cache-poisoning]
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Runs the tests with coverage; fails when a threshold in bridge/ or frontend/vitest.config.ts is not met.
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('*/coverage/coverage.txt') != '' }}
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          for workspace in bridge frontend; do
            [ -f "$workspace/coverage/coverage.txt" ] || continue
            {
              echo "### Coverage: $workspace (Node $NODE_VERSION)"
              echo '```'
              cat "$workspace/coverage/coverage.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - run: npm run build
      # SONAR_TOKEN is not available to pull requests from forks or Dependabot. The scan runs once,
      # on the latest patch of the production Node line, with the coverage from this run.
      - name: Prefix lcov paths with the workspace
        if: ${{ matrix.node == '24' }}
        # vitest writes workspace-relative paths into lcov.info; Sonar resolves them from the repo root.
        run: |
          for workspace in bridge frontend; do
            sed -i "s|^SF:|SF:$workspace/|" "$workspace/coverage/lcov.info"
          done
      - name: SonarQube Cloud scan
        if: >-
          matrix.node == '24' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          # Kept as a repository secret: an environment on this matrix job would log a deployment for
          # every run, and the token can only submit analyses. Forks and Dependabot get no secrets.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # zizmor: ignore[secrets-outside-env]

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deployment directories hold .env and mix.json next to the compose files, inside the checkout.
      - name: Check that secrets are ignored
        run: |
          for path in deploy/.env deploy/mix.json deploy/mix.json.bak bridge/.env bridge/mix.json; do
            git check-ignore -q --no-index "$path" || { echo "::error::git does not ignore $path"; exit 1; }
          done
          for path in deploy/.env.example bridge/.env.example bridge/mix.example.json; do
            if git check-ignore -q --no-index "$path"; then echo "::error::git ignores the template $path"; exit 1; fi
          done
      # Builds with secret files present, then checks that none reached the image, by name or by content
      # (a marker string that only those files contain).
      - name: Build image with secrets in the checkout
        run: |
          marker="river-ci-secret-$(openssl rand -hex 16)"
          echo "MARKER=$marker" >> "$GITHUB_ENV"
          for path in deploy/.env deploy/mix.json bridge/mix.json; do printf '%s\n' "$marker" > "$path"; done
          docker build -f deploy/Dockerfile -t beszel-river:ci .
          rm deploy/.env deploy/mix.json bridge/mix.json
      - name: Check image for secrets
        run: |
          found=$(docker run --rm --user root --entrypoint find beszel-river:ci / -xdev \
            \( \( -name 'mix*.json*' ! -name mix.example.json \) -o \( -name '.env*' ! -name .env.example \) \) -print)
          [ -z "$found" ] || { echo "::error::secret files in the image: $found"; exit 1; }
          status=0
          docker run --rm --user root --entrypoint grep beszel-river:ci -rqsF "$MARKER" /app || status=$?
          [ "$status" -eq 1 ] || { echo "::error::secret content in the image (grep exit $status)"; exit 1; }
      # Without a hub, then healthy against a real hub on its Docker network and on the host's loopback.
      - name: Test container
        run: python3 deploy/test/container.py beszel-river:ci
      - name: Check compose files
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.beszel-network.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.host-network.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.proxy-network.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.beszel-network.yml \
            -f deploy/compose.proxy-network.yml config --quiet
      - name: Check nginx configs
        run: |
          le="$RUNNER_TEMP/le/live/river.example.com"
          mkdir -p "$le"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=river.example.com \
            -keyout "$le/privkey.pem" -out "$le/fullchain.pem"
          nginx=$(python3 deploy/test/ci_images.py nginx)
          # Own server blocks: river.conf (bridge) and river-container.conf. nginx -t opens the listen
          # sockets, and containers on Docker's default network have no IPv6.
          for site in river river-container; do
            sed '/listen \[::\]/d' "deploy/nginx/$site.conf" > "$RUNNER_TEMP/$site.conf"
            docker run --rm -v "$RUNNER_TEMP/$site.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/deploy/nginx:/etc/nginx/snippets:ro" \
              -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" "$nginx" nginx -t
          done
          # Paths in an existing server block: river-path.conf (bridge) and river-container-path.conf.
          for snippet in river-path river-container-path; do
            printf '%s\n' 'include /etc/nginx/snippets/river-limits.conf;' \
              "server { listen 8080; include /etc/nginx/snippets/$snippet.conf; }" > "$RUNNER_TEMP/existing.conf"
            docker run --rm -v "$RUNNER_TEMP/existing.conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "$PWD/deploy/nginx:/etc/nginx/snippets:ro" "$nginx" nginx -t
          done
      - name: Check Caddy configs
        run: |
          caddy=$(python3 deploy/test/ci_images.py caddy)
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" "$caddy" caddy validate --config /etc/caddy/Caddyfile
          printf 'example.com {\n\timport /etc/caddy/Caddyfile.path\n}\n' > "$RUNNER_TEMP/Caddyfile.site"
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" -v "$RUNNER_TEMP/Caddyfile.site:/site/Caddyfile:ro" \
            "$caddy" caddy validate --config /site/Caddyfile
      # Address grouping and connection limits for every /stream location, then the container configs
      # in front of a stub container: compression, redirects, unbuffered events, disconnects.
      - name: Test nginx configs
        run: python3 deploy/test/nginx.py
      - name: Test Caddy configs
        run: python3 deploy/test/caddy.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # only Node itself is needed here
      - name: Check systemd sandbox
        run: python3 deploy/test/systemd.py

  # Publishes ghcr.io/juusolatva/beszel-river from a commit that passed every check in this run: edge from
  # main when a file that goes into the image changed, and X.Y.Z, X.Y, X and latest from a vX.Y.Z tag.
  # No build cache is shared with other runs, so a pull request cannot poison a published image.
  publish:
    needs: [check, deploy]
    if: >-
      github.repository == 'juusolatva/beszel-river' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write # store the provenance and SBOM attestations (gh attestation verify)
      artifact-metadata: write # link the image to this repository (storage record)
    env:
      IMAGE: ghcr.io/juusolatva/beszel-river
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # main and the tags, for the tag checks and the changed-file list
          persist-credentials: false
      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [[ $REF == refs/tags/* ]]; then
            # A tag on an unmerged branch must not publish latest.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "::error::$REF_NAME is not on main"; exit 1; }
            semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
            if [[ $REF_NAME =~ ^v${semver}$ ]]; then
              major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
              version=${REF_NAME#v}
              # The moving tags follow the newest release: a patch for an older line does not move them back.
              newest() { git tag -l "$1" | grep -E "^v${semver}\$" | sort -V | tail -n 1; }
              tags=$IMAGE:$version
              [ "$(newest "v$major.$minor.*")" != "$REF_NAME" ] || tags+=",$IMAGE:$major.$minor"
              [ "$(newest "v$major.*")" != "$REF_NAME" ] || tags+=",$IMAGE:$major"
              [ "$(newest 'v*')" != "$REF_NAME" ] || tags+=",$IMAGE:latest"
            elif [[ $REF_NAME =~ ^v${semver}-[0-9A-Za-z.-]+$ ]]; then
              version=${REF_NAME#v} tags=$IMAGE:$version # pre-release: only its own tag
            else
              echo "::error::$REF_NAME is not a vX.Y.Z release tag"; exit 1
            fi
          else
            version=edge tags=$IMAGE:edge
            # On a push to main, build only if a file that goes into the image changed. If the list cannot
            # be made (first push, force-push), build: a spare build is cheap, a stale edge is not.
            if [ "$EVENT" = push ] && [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] && [[ ! $BEFORE =~ ^0+$ ]] &&
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
              build=false
              while IFS= read -r path; do
                case $path in
                  bridge/test/* | frontend/test/* | vitest.config.ts | */vitest.config.ts | *.md) ;;
                  bridge/* | frontend/* | shared/* | package.json | package-lock.json | .npmrc | \
                    tsconfig.base.json | deploy/Dockerfile | .dockerignore) build=true ;;
                esac
              done <<< "$changed"
            fi
          fi
          { echo "build=$build"; echo "version=$version"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
          if [ "$build" = true ]; then
            echo "Publishing ${tags//,/, }" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No file that goes into the image changed; edge stays as it is." >> "$GITHUB_STEP_SUMMARY"
          fi
      # No QEMU: only the final stage is per platform, and it has no RUN step (deploy/Dockerfile).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.build == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.plan.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          # GitHub attestations below instead of BuildKit's, which show up as unknown/unknown platforms.
          provenance: false
          sbom: false
      - name: Attest build provenance
        if: steps.plan.outputs.build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM
        if: steps.plan.outputs.build == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        if: steps.plan.outputs.build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
