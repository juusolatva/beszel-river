name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0: minimum in package.json "engines". 24: production version, keep equal to .nvmrc.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the tests with coverage; fails when a threshold in bridge/vitest.config.ts is not met.
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('bridge/coverage/coverage.txt') != '' }}
        run: |
          {
            echo "### Bridge coverage (Node ${{ matrix.node }})"
            echo '```'
            cat bridge/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
