name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24.22.1: production pin in .nvmrc and minimum in package.json "engines". 24: latest LTS patch.
        # 26: the current release line, the next production version.
        node: ["24.22.1", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for Sonar blame and new-code detection
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Runs the tests with coverage; fails when a threshold in bridge/ or frontend/vitest.config.ts is not met.
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('*/coverage/coverage.txt') != '' }}
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          for workspace in bridge frontend; do
            [ -f "$workspace/coverage/coverage.txt" ] || continue
            {
              echo "### Coverage: $workspace (Node $NODE_VERSION)"
              echo '```'
              cat "$workspace/coverage/coverage.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - run: npm run build
      # SONAR_TOKEN is not available to pull requests from forks or Dependabot. The scan runs once,
      # on the latest patch of the production Node line, with the coverage from this run.
      - name: Prefix lcov paths with the workspace
        if: ${{ matrix.node == '24' }}
        # vitest writes workspace-relative paths into lcov.info; Sonar resolves them from the repo root.
        run: |
          for workspace in bridge frontend; do
            sed -i "s|^SF:|SF:$workspace/|" "$workspace/coverage/lcov.info"
          done
      - name: SonarQube Cloud scan
        if: >-
          matrix.node == '24' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]'))
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          # Kept as a repository secret: an environment on this matrix job would log a deployment for
          # every run, and the token can only submit analyses. Forks and Dependabot get no secrets.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # zizmor: ignore[secrets-outside-env]

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deployment directories hold .env and mix.json next to the compose files, inside the checkout.
      - name: Check that secrets are ignored
        run: |
          for path in deploy/.env deploy/mix.json deploy/mix.json.bak bridge/.env bridge/mix.json; do
            git check-ignore -q --no-index "$path" || { echo "::error::git does not ignore $path"; exit 1; }
          done
          for path in deploy/.env.example bridge/.env.example bridge/mix.example.json; do
            if git check-ignore -q --no-index "$path"; then echo "::error::git ignores the template $path"; exit 1; fi
          done
      # Builds with secret files present, then checks that none reached the image, by name or by content
      # (a marker string that only those files contain).
      - name: Build image with secrets in the checkout
        run: |
          marker="river-ci-secret-$(openssl rand -hex 16)"
          echo "MARKER=$marker" >> "$GITHUB_ENV"
          for path in deploy/.env deploy/mix.json bridge/mix.json; do printf '%s\n' "$marker" > "$path"; done
          docker build -f deploy/Dockerfile -t beszel-river:ci .
          rm deploy/.env deploy/mix.json bridge/mix.json
      - name: Check image for secrets
        run: |
          found=$(docker run --rm --user root --entrypoint find beszel-river:ci / -xdev \
            \( \( -name 'mix*.json*' ! -name mix.example.json \) -o \( -name '.env*' ! -name .env.example \) \) -print)
          [ -z "$found" ] || { echo "::error::secret files in the image: $found"; exit 1; }
          status=0
          docker run --rm --user root --entrypoint grep beszel-river:ci -rqsF "$MARKER" /app || status=$?
          [ "$status" -eq 1 ] || { echo "::error::secret content in the image (grep exit $status)"; exit 1; }
      # Without a hub, then healthy against a real hub on its Docker network and on the host's loopback.
      - name: Test container
        run: python3 deploy/test/container.py beszel-river:ci
      - name: Check compose files
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.beszel-network.yml config --quiet
          docker compose -f deploy/compose.yml -f deploy/compose.host-network.yml config --quiet
      - name: Check nginx configs
        run: |
          le="$RUNNER_TEMP/le/live/river.example.com"
          mkdir -p "$le"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=river.example.com \
            -keyout "$le/privkey.pem" -out "$le/fullchain.pem"
          nginx=$(python3 deploy/test/ci_images.py nginx)
          # nginx -t opens the listen sockets, and containers on Docker's default network have no IPv6.
          sed '/listen \[::\]/d' deploy/nginx/river.conf > "$RUNNER_TEMP/river.conf"
          docker run --rm -v "$RUNNER_TEMP/river.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx:/etc/nginx/snippets:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" "$nginx" nginx -t
          printf '%s\n' 'include /etc/nginx/snippets/river-limits.conf;' \
            'server { listen 8080; include /etc/nginx/snippets/river-path.conf; }' > "$RUNNER_TEMP/existing.conf"
          docker run --rm -v "$RUNNER_TEMP/existing.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx:/etc/nginx/snippets:ro" "$nginx" nginx -t
      - name: Check nginx address grouping and connection limits
        run: python3 deploy/test/nginx.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check systemd sandbox
        run: python3 deploy/test/systemd.py
