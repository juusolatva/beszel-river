name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0: minimum in package.json "engines". 24: production version, keep equal to .nvmrc.
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the tests with coverage; fails when a threshold in bridge/vitest.config.ts is not met.
      - run: npm run coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('bridge/coverage/coverage.txt') != '' }}
        run: |
          {
            echo "### Bridge coverage (Node ${{ matrix.node }})"
            echo '```'
            cat bridge/coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build bridge image
        run: docker build -f deploy/bridge.Dockerfile -t beszel-river-bridge .
      - name: Check compose file
        run: |
          cp bridge/.env.example bridge/.env
          docker compose -f deploy/compose.yml config --quiet
      - name: Check nginx configs
        run: |
          le="$RUNNER_TEMP/le/live/river.example.com"
          mkdir -p "$le"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=river.example.com \
            -keyout "$le/privkey.pem" -out "$le/fullchain.pem"
          # nginx -t opens the listen sockets, and containers on Docker's default network have no IPv6.
          sed '/listen \[::\]/d' deploy/nginx/river.conf > "$RUNNER_TEMP/river.conf"
          docker run --rm -v "$RUNNER_TEMP/river.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" nginx:stable-alpine nginx -t
          printf '%s\n' 'limit_conn_zone $binary_remote_addr zone=river_stream:10m;' \
            'server { listen 8080; include /etc/nginx/snippets/river-path.conf; }' > "$RUNNER_TEMP/existing.conf"
          docker run --rm -v "$RUNNER_TEMP/existing.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx:/etc/nginx/snippets:ro" nginx:stable-alpine nginx -t
