# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '40 15 * * 6'
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  scan-scheduled:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        -r
        ./
  # The PR workflow below writes the base branch scan to old-results.json in the
  # workspace, then runs `git checkout -f` on the pull request, which replaces
  # that file if the pull request tracks one. A committed baseline that lists the
  # PR's own vulnerabilities would make them look pre-existing, so refuse any
  # tracked file at a path the workflow uses for results. Kept as its own job, not
  # a `needs:` of scan-pr: a failed need skips scan-pr, and a skipped check passes.
  guard-osv-results:
    name: Guard OSV result paths
    # Only pull_request and merge_group run this job, so a newer push may cancel
    # an older run. Scans of main stay outside any group: queued scans there
    # would replace each other.
    concurrency:
      group: osv-guard-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read # Read commit contents
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse committed OSV result files
        run: |
          hits=$(git ls-files | grep -E '(^|/)[^/]*(old-results|new-results)\.json$|\.sarif$' || true)
          if [ -n "$hits" ]; then
            while IFS= read -r f; do
              echo "::error file=${f}::Reserved for OSV-Scanner results in CI; do not commit it."
            done <<< "$hits"
            exit 1
          fi
          echo "No tracked OSV result paths."
  scan-pr:
    permissions:
      actions: read # Required for SARIF upload
      contents: read # Read commit contents
      security-events: write # Upload SARIF file to GitHub code scanning
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36" # v2.7.0
    with:
      scan-args: |-
        -r
        ./
