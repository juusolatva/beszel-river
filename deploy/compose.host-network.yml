# For a Beszel hub on this host that listens only on loopback, such as one with network_mode: host.
# Use together with compose.yml:
#   docker compose -f compose.yml -f compose.host-network.yml up -d
# or set COMPOSE_FILE=compose.yml:compose.host-network.yml in .env.
# The river then shares the host's network and reaches the hub at BESZEL_URL=http://127.0.0.1:8090 (the
# hub's port). It listens on the host's loopback directly, so both of its ports are host ports:
# RIVER_PORT (default 8787) for the page and RIVER_HEALTH_PORT (default 8788) for the health check.
services:
  river:
    network_mode: host
    ports: !reset []
    # host.docker.internal has no use on the host's network, and some Docker versions reject it there.
    extra_hosts: !reset []
    environment:
      BIND_HOST: 127.0.0.1
      BIND_PORT: "${RIVER_PORT:-8787}"
      HEALTH_PORT: "${RIVER_HEALTH_PORT:-8788}"
