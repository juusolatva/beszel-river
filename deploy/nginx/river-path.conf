# Alternative to river.conf: the page under /river/ in an existing server block. Include this file
# inside that block (include /etc/nginx/snippets/river-path.conf;) and put this line in the http block:
#   include /etc/nginx/snippets/river-limits.conf;
# For another path, replace /river everywhere. The build uses relative URLs, so it needs no change.
#
# These locations set no headers, so they get the enclosing server block's. Send the headers from
# river.conf there (Content-Security-Policy, X-Content-Type-Options, Referrer-Policy, and HSTS if the
# site is HTTPS only); a site CSP stricter than river.conf's must still allow inline styles. Adding
# add_header in any location here would drop the server block's headers for it.

location = /river {
    return 301 /river/;
}

location /river/ {
    alias /var/www/beszel-river/;
    # index.html names the current hashed assets, so browsers must revalidate it.
    expires -1;
}

# Vite puts a content hash in every file name here.
location /river/assets/ {
    alias /var/www/beszel-river/assets/;
    expires max;
}

location = /river/stream {
    limit_conn river_stream 8;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8787/stream;
    proxy_hide_header X-Content-Type-Options;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
}
