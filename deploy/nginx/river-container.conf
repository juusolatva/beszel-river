# Site config for the container (deploy/compose.yml), which serves the page and the stream on
# 127.0.0.1:8095. Copy to /etc/nginx/conf.d/river-container.conf (it must be included in the http
# block) and river-limits.conf and river-stream.conf to /etc/nginx/snippets/, replace
# river.example.com and the certificate paths, then: nginx -t && systemctl reload nginx
# If RIVER_PORT in .env moved the container's port, change 8095 below to match.

# Concurrent /stream requests per IPv4 address or IPv6 /64. Include once in the http block.
include /etc/nginx/snippets/river-limits.conf;

server {
    listen 80;
    listen [::]:80;
    server_name river.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/1.1 browsers allow 6 connections per host, so a few tabs could use them all up on open streams.
    # nginx older than 1.25.1 (Debian 12, Ubuntu 24.04): delete this line and use "listen 443 ssl http2;".
    http2 on;
    server_name river.example.com;

    ssl_certificate     /etc/letsencrypt/live/river.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/river.example.com/privkey.pem;

    # The container sends the page's other security headers (Content-Security-Policy and more); only
    # the proxy knows that this host serves HTTPS only. Keep it here: an add_header inside a location
    # would drop this one there. Subdomains are left to their own servers.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The page and its assets, with the container's caching headers. Paths it does not serve get its 404,
    # and its health check is on a separate listener that cannot be reached from here.
    location / {
        # With a URI here nginx forwards its normalized path, not the client's raw request-target.
        proxy_pass http://127.0.0.1:8095/;
        gzip on;
        # The container's types for scripts and styles; nginx always compresses text/html.
        gzip_types text/css text/javascript;
        gzip_vary on;
    }

    location = /stream {
        proxy_pass http://127.0.0.1:8095/stream;
        include /etc/nginx/snippets/river-stream.conf;
    }
}
