# Settings for every /stream location: include inside it, after its proxy_pass. Install next to
# river-limits.conf (/etc/nginx/snippets/), which defines the river_stream zone used here.

# Concurrent streams per IPv4 address or IPv6 /64.
limit_conn river_stream 8;
limit_conn_status 429;
# Keep the long-lived response unbuffered and uncompressed, so each event reaches the browser at once.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
# The bridge sends a comment line every 15 s, so an open stream is never idle this long.
proxy_read_timeout 1h;
gzip off;
