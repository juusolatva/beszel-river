# Site config. Copy to /etc/nginx/conf.d/river.conf (it must be included in the http block), replace
# river.example.com and the certificate paths, then: nginx -t && systemctl reload nginx

# Concurrent /stream requests per client address. Under HTTP/2 every request counts on its own.
limit_conn_zone $binary_remote_addr zone=river_stream:10m;

server {
    listen 80;
    listen [::]:80;
    server_name river.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/1.1 browsers allow 6 connections per host, so a few tabs could use them all up on open streams.
    # nginx older than 1.25.1 (Debian 12, Ubuntu 24.04): delete this line and use "listen 443 ssl http2;".
    http2 on;
    server_name river.example.com;

    ssl_certificate     /etc/letsencrypt/live/river.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/river.example.com/privkey.pem;

    # Contents of frontend/dist/ after npm run build -w @beszel-river/frontend.
    root /var/www/beszel-river;
    index index.html;

    # Only here: any add_header inside a location would drop these for that location.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # This host only serves HTTPS (see the redirect above). Subdomains are left to their own servers.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
        # index.html names the current hashed assets, so browsers must revalidate it.
        expires -1;
    }

    # Vite puts a content hash in every file name here.
    location /assets/ {
        expires max;
    }

    # The bridge's other endpoint, /healthz, stays private.
    location = /stream {
        limit_conn river_stream 8;
        limit_conn_status 429;
        # With a URI here nginx forwards its normalized path, not the client's raw request-target.
        proxy_pass http://127.0.0.1:8787/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }
}
