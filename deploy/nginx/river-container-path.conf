# Alternative to river-container.conf: the container's page under /river/ in an existing server
# block. Include this file inside that block (include /etc/nginx/snippets/river-container-path.conf;),
# put this line in the http block:
#   include /etc/nginx/snippets/river-limits.conf;
# and copy river-stream.conf, which the /stream location includes, to the same directory.
# For another path, replace /river everywhere; the container needs no change. If RIVER_PORT in .env
# moved the container's port, change 8787 below to match.
#
# The container sends the page's security headers (Content-Security-Policy, X-Content-Type-Options,
# Referrer-Policy and the Cross-Origin ones); the server block adds HSTS if the site is HTTPS only.
# If the site sends its own Content-Security-Policy too, browsers enforce both, so a site policy
# stricter than the container's must still allow inline styles. Other duplicated headers are harmless.

# Relative URLs in the page need the trailing slash.
location = /river {
    return 301 /river/;
}

# The page and its assets; /river/ is forwarded as /, so the container sees the paths it serves.
location /river/ {
    proxy_pass http://127.0.0.1:8787/;
    gzip on;
    # The container's types for scripts and styles; nginx always compresses text/html.
    gzip_types text/css text/javascript;
    gzip_vary on;
}

location = /river/stream {
    proxy_pass http://127.0.0.1:8787/stream;
    include /etc/nginx/snippets/river-stream.conf;
}
