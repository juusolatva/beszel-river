# Include once in the http block, for any of the nginx configs here.
# IPv4 keeps its full 4-byte address; IPv6 shares one key per /64 regardless of text compression.
# Match every byte, including NUL and newline, so no IPv6 address falls back to a /128 key.
map $binary_remote_addr $river_client_key {
    default $binary_remote_addr;
    "~^(?<river_ipv6_prefix>[\s\S]{8})[\s\S]{8}$" $river_ipv6_prefix;
}
limit_conn_zone $river_client_key zone=river_stream:10m;
