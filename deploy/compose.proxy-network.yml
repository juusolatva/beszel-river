# For a reverse proxy that itself runs in Docker: joins the proxy's network, so the proxy reaches the
# river at river:8787 instead of 127.0.0.1:8787, and stops publishing the port on the host. Use together
# with compose.yml (and compose.beszel-network.yml if needed):
#   docker compose -f compose.yml -f compose.proxy-network.yml up -d
# or set COMPOSE_FILE=compose.yml:compose.proxy-network.yml in .env. Not with compose.host-network.yml.
services:
  river:
    # default keeps the network the river had without this file.
    networks: [default, proxy]
    ports: !reset []

networks:
  proxy:
    # Shared with the proxy container; create it once with: docker network create proxy
    external: true
    name: ${PROXY_NETWORK:-proxy}
