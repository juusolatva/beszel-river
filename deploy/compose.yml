# The river: page and stream from one container at http://127.0.0.1:8095. Next to this file: .env
# (from .env.example) and mix.json (from bridge/mix.example.json, then edited). README, "Deployment".
#   docker compose up -d --build
# For a hub in Docker or one listening only on loopback, add an override (see .env.example).
name: beszel-river

services:
  river:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed container settings; listed here so .env cannot override them.
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8095"
      STATIC_DIR: /app/frontend
      HEALTH_PORT: "8788"
      MIX_FILE: /config/mix.json
    volumes:
      # Required. create_host_path: false makes a missing file an error at Compose setup instead of
      # Docker creating an empty directory in its place. It must be readable by uid 1000.
      - type: bind
        source: ./mix.json
        target: /config/mix.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Loopback only: put a reverse proxy in front for anything public.
      - "127.0.0.1:${RIVER_PORT:-8095}:8095"
      # LAN testing only, plain HTTP: replace the line above with
      # - "${RIVER_PORT:-8095}:8095"
    extra_hosts:
      # Lets BESZEL_URL=http://host.docker.internal:8090 reach a hub on this host.
      - "host.docker.internal:host-gateway"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
