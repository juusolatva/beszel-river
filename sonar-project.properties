sonar.organization=juusolatva
sonar.projectKey=juusolatva_beszel-river
sonar.projectName=beszel-river

sonar.sources=shared/src,bridge/src,frontend/src
sonar.tests=bridge/test,frontend/test
sonar.sourceEncoding=UTF-8

# Written by `npm run coverage`; the CI scan step prefixes the paths with the workspace directory.
sonar.javascript.lcov.reportPaths=bridge/coverage/lcov.info,frontend/coverage/lcov.info

# Fail the CI scan step when the quality gate fails, instead of reporting
# it only in SonarQube Cloud's own check.
sonar.qualitygate.wait=true
